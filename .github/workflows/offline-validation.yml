name: Offline validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-and-evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out frozen artifacts without line-ending conversion
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run the shared offline suite
        run: python -B scripts/run_offline_checks.py
