name: Offline validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-and-evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out frozen artifacts without line-ending conversion
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test packet identity refusals
        run: python -B scripts/test_verify_final_validation_packet.py
      - name: Verify the prepared disabled packet and frozen inputs
        run: python -B scripts/verify_final_validation_packet.py
      - name: Test control identity canonicalization
        run: python -B scripts/test_control_canonicalization.py
      - name: Execute notebook fixtures and exposure refusal cases
        run: python -B scripts/test_final_validation_v2_notebook.py
      - name: Test artifact manifest validation
        run: python -B scripts/test_verify_artifact_manifest.py
      - name: Verify the preserved CPU control evidence
        run: python -B scripts/verify_artifact_manifest.py reference/control_replay_run_2026-10-07 reference/control_replay_review/raw_sha256.json
